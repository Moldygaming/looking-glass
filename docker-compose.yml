services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lookingglass
      POSTGRES_PASSWORD: lookingglass
      POSTGRES_DB: lookingglass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lookingglass"]
      interval: 5s
      timeout: 5s
      retries: 12

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
    ports:
      - "10000:10000"

  api:
    build: ./src/api
    environment:
      DATABASE_URL: postgresql+asyncpg://lookingglass:lookingglass@postgres:5432/lookingglass
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
      WEB_ORIGIN: http://localhost:3000
      APP_ENV: development
      SEED_ON_STARTUP: "true"
      ENTRA_TENANT_ID: ${AUTH_MICROSOFT_ENTRA_ID_TENANT_ID:-}
      ENTRA_CLIENT_ID: ${AUTH_MICROSOFT_ENTRA_ID_ID:-}
      ENTRA_CLIENT_SECRET: ${AUTH_MICROSOFT_ENTRA_ID_SECRET:-}
      ENTRA_SYNC_INTERVAL_SECONDS: ${ENTRA_SYNC_INTERVAL_SECONDS:-3600}
      ENTRA_ADMIN_GROUP_ID: ${ENTRA_ADMIN_GROUP_ID:-}
      ENTRA_ACCESS_GROUP_ID: ${ENTRA_ACCESS_GROUP_ID:-}
      ENTRA_ADMIN_ROLE: ${ENTRA_ADMIN_ROLE:-PlatformAdmin}
      BREAK_GLASS_USERNAME: ${BREAK_GLASS_USERNAME:-infraadmin}
      BREAK_GLASS_PASSWORD: ${BREAK_GLASS_PASSWORD:-admin123+}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: ./src/api
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql+asyncpg://lookingglass:lookingglass@postgres:5432/lookingglass
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
      WORKER_INTERVAL_SECONDS: "21600"
      SEED_ON_STARTUP: "false"
      ENTRA_TENANT_ID: ${AUTH_MICROSOFT_ENTRA_ID_TENANT_ID:-}
      ENTRA_CLIENT_ID: ${AUTH_MICROSOFT_ENTRA_ID_ID:-}
      ENTRA_CLIENT_SECRET: ${AUTH_MICROSOFT_ENTRA_ID_SECRET:-}
      ENTRA_SYNC_INTERVAL_SECONDS: ${ENTRA_SYNC_INTERVAL_SECONDS:-3600}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  web:
    build: ./src/web
    environment:
      API_URL: http://api:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
      AUTH_SECRET: ${AUTH_SECRET:-dev-auth-secret-change-me-please-32ch}
      NEXTAUTH_URL: http://localhost:3000
      AUTH_URL: http://localhost:3000
      AUTH_MICROSOFT_ENTRA_ID_ID: ${AUTH_MICROSOFT_ENTRA_ID_ID:-}
      AUTH_MICROSOFT_ENTRA_ID_SECRET: ${AUTH_MICROSOFT_ENTRA_ID_SECRET:-}
      AUTH_MICROSOFT_ENTRA_ID_TENANT_ID: ${AUTH_MICROSOFT_ENTRA_ID_TENANT_ID:-}
      AUTH_ENTRA_ADMIN_GROUP_ID: ${ENTRA_ADMIN_GROUP_ID:-}
      AUTH_ENTRA_ACCESS_GROUP_ID: ${ENTRA_ACCESS_GROUP_ID:-}
      AUTH_BREAK_GLASS_USERNAME: ${BREAK_GLASS_USERNAME:-infraadmin}
      AUTH_BREAK_GLASS_PASSWORD: ${BREAK_GLASS_PASSWORD:-admin123+}
      BREAK_GLASS_USERNAME: ${BREAK_GLASS_USERNAME:-infraadmin}
      BREAK_GLASS_PASSWORD: ${BREAK_GLASS_PASSWORD:-admin123+}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
